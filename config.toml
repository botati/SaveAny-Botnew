lang = "ar" # لغة البوت (ar للعربية أو en للإنجليزية)

[telegram]
token = "ضع_توكن_البوت_هنا" # احصل عليه من @BotFather

# إعداد التخزين (سنستخدم ميزة إعادة الرفع إلى تيليجرام كأسهل طريقة لتجنب قيود هيروكو)
[[storages]]
name = "Telegram Cloud"
type = "telegram"
enable = true
chat_id = 0 # ضع آي دي القناة أو المجموعة التي تريد حفظ الملفات فيها (أو اتركه 0 ليرسلها لك في الخاص)

[[users]]
id = 123456789 # ضع الآي دي الخاص بك في تيليجرام (مهم جداً لتكون الآدمن)
storages = ["Telegram Cloud"]
blacklist = true
